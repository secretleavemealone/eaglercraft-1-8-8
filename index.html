<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 1.8.8</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#080b13;color:#f5f7ff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#101827dd,#101827bb),url("./cherryblocked-minecraft-garden.jpg") center/cover fixed no-repeat}
.card{width:min(460px,100%);padding:34px;border:1px solid #ffffff30;border-radius:20px;background:#101827cc;backdrop-filter:blur(16px);box-shadow:0 24px 80px #0009}
h1{font-size:30px;margin:0 0 8px}.sub{color:#c3cde0;margin:0 0 26px;font-size:14px;line-height:1.5}
label{display:block;font-size:13px;color:#d6def0;margin:0 0 9px}
select{width:100%;padding:14px;border:1px solid #ffffff30;border-radius:10px;background:#202b40;color:#fff;font-size:15px}
button,.launch{display:block;width:100%;margin-top:16px;padding:14px 16px;border:0;border-radius:10px;background:#8b5cf6;color:#fff;font-size:15px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.launch.secondary{background:#25334b;border:1px solid #ffffff30}
#game{display:none;position:fixed;inset:0;background:#000}
#game iframe{width:100%;height:100%;border:0;background:#000}\n#loading-message{display:none;position:absolute;z-index:4;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;background:#080b13;color:#fff;font-size:20px;font-weight:700;line-height:1.5;pointer-events:none}
#back{position:fixed;z-index:5;top:12px;right:12px;width:auto;margin:0;padding:10px 14px;background:#202b40;border:1px solid #ffffff35}
#chat-toggle{position:static;width:100%;margin-top:12px;padding:13px 16px;background:#8b5cf6;border:1px solid #ffffff45}
#chat-panel{display:none;position:relative;width:100%;height:360px;margin-top:12px;padding:14px;border:1px solid #ffffff35;border-radius:14px;background:#101827f5;box-shadow:0 18px 55px #000b;flex-direction:column;gap:10px}
#chat-panel.open{display:flex}
#chat-head{display:flex;align-items:center;justify-content:space-between;font-weight:700}
#chat-close{width:auto;margin:0;padding:6px 10px;background:#25334b}
#chat-messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:8px;background:#080d18}
.chat-message{overflow-wrap:anywhere;font-size:13px;line-height:1.4}
.chat-message strong{color:#c4a7ff;margin-right:6px}
#chat-status{min-height:16px;color:#b9c6dc;font-size:12px}
#chat-form{display:flex;gap:7px}
#chat-input{flex:1;min-width:0;padding:11px;border:1px solid #ffffff30;border-radius:8px;background:#202b40;color:white}
#chat-send{width:auto;margin:0;padding:0 14px}
@media(max-width:480px){.card{padding:25px}}
</style>
</head>
<body>
<main class="card" id="picker">
<h1>Minecraft 1.8.8</h1>
<p class="sub">Choose a version and launch the browser game.</p>\n<p class="sub" style="margin-top:-14px;color:#a7f3d0;font-weight:700">New version added: Minecraft 1.12.2!</p>
<label for="version">Game version</label>
<select id="version">
<option value="1.8.8">Minecraft 1.8.8</option>
<option value="1.12.2">Minecraft 1.12.2</option>
</select>
<button id="play" type="button">Play Minecraft 1.8.8</button>
<a class="launch secondary" id="direct" href="./game.html" target="_blank" rel="noopener noreferrer">Open local game files in a new tab</a>
<button id="chat-toggle" type="button">Open Server Chat</button>
<aside id="chat-panel" aria-label="Minecraft chat">
  <div id="chat-head"><span>Server Chat</span><button id="chat-close" type="button">Close</button></div>
  <div id="chat-status">Connecting to chat...</div>
  <div id="chat-messages" aria-live="polite"></div>
  <form id="chat-form"><input id="chat-input" maxlength="300" autocomplete="off" placeholder="Type a message..." aria-label="Message"><button id="chat-send" type="submit">Send</button></form>
</aside>
</main>
<section id="game" aria-label="Minecraft game">
<button id="back" type="button">Back to versions</button>
<iframe id="client" title="Minecraft 1.8.8" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe>
</section>
<script>
const picker=document.getElementById('picker');
const game=document.getElementById('game');
const frame=document.getElementById('client');
const version=document.getElementById('version');
const play=document.getElementById('play');
const gameUrl='./game.html';\nconst loadingMessage=document.getElementById('loading-message');
version.addEventListener('change',()=>{play.textContent=version.value?'Play Minecraft '+version.value:'Coming soon';play.disabled=!version.value;});
play.addEventListener('click',async()=>{
 const selected=version.value;
 if(selected!=='1.8.8' && selected!=='1.12.2')return;
 picker.style.display='none';
 document.getElementById('chat-panel').classList.remove('open');
 document.getElementById('chat-toggle').style.display='none';
 document.getElementById('chat-panel').style.display='none';
 game.style.display='block';
 if(selected==='1.8.8'){
   frame.src=gameUrl;
   return;
 }
 frame.src='about:blank';
 try{
   const response=await fetch('./eaglercraft-1.12.2 (15).html.gz');
   if(!response.ok)throw new Error('The local 1.12.2 game file is not uploaded yet.');
   if(!('DecompressionStream' in window))throw new Error('This browser does not support gzip decompression.');
   const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
   const html=new Blob([await new Response(stream).arrayBuffer()],{type:'text/html'});
   frame.src=URL.createObjectURL(html);
 }catch(error){
   frame.srcdoc='<html><body style="background:#101827;color:white;font:16px Arial;padding:30px"><h2>1.12.2 game file missing</h2><p>Upload eaglercraft-1.12.2 (15).html.gz to the repository root, then reload.</p></body></html>';
 }
});
document.getElementById('direct').href=gameUrl;
document.getElementById('back').addEventListener('click',()=>{
 frame.src='about:blank';
 game.style.display='none';
 document.getElementById('chat-toggle').style.display='block';
 document.getElementById('chat-panel').style.display='';
 picker.style.display='grid';
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, query, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZy9hSB6JRmsmduheEIBZnG4q6GatPd5c",
  authDomain: "czxx-8392d.firebaseapp.com",
  databaseURL: "https://czxx-8392d-default-rtdb.firebaseio.com",
  projectId: "czxx-8392d",
  storageBucket: "czxx-8392d.firebasestorage.app",
  messagingSenderId: "216434211403",
  appId: "1:216434211403:web:96c8b687ad2a7e8cf1abce",
  measurementId: "G-MR4F9DEVVR"
};

const app = initializeApp(firebaseConfig, "minecraft-chat");
const db = getDatabase(app);
const messagesRef = query(ref(db, "minecraftChat/messages"), limitToLast(80));
const toggle = document.getElementById("chat-toggle");
const panel = document.getElementById("chat-panel");
const close = document.getElementById("chat-close");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");
const messages = document.getElementById("chat-messages");
const status = document.getElementById("chat-status");
let username = localStorage.getItem("minecraftChatUsername") || "";

function getUsername() {
  if (username) return username;
  const entered = window.prompt("Choose a username for Minecraft chat (2–16 characters):");
  if (entered === null) return "";
  const clean = entered.trim().replace(/\s+/g, " ").slice(0, 16);
  if (clean.length < 2) {
    window.alert("Your username must be at least 2 characters.");
    return "";
  }
  username = clean;
  localStorage.setItem("minecraftChatUsername", username);
  return username;
}

function addMessage(data) {
  const line = document.createElement("div");
  line.className = "chat-message";
  const name = document.createElement("strong");
  name.textContent = String(data.name || "Player").slice(0, 16);
  const body = document.createElement("span");
  body.textContent = String(data.text || "").slice(0, 300);
  line.append(name, body);
  messages.appendChild(line);
  messages.scrollTop = messages.scrollHeight;
}

onChildAdded(messagesRef, snapshot => addMessage(snapshot.val() || {}), error => {
  status.textContent = "Chat error: " + error.message;
});

toggle.addEventListener("click", () => {
  if (!getUsername()) return;
  panel.classList.add("open");
  input.focus();
});
close.addEventListener("click", () => panel.classList.remove("open"));

form.addEventListener("submit", async event => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || !username) return;
  input.disabled = true;
  try {
    await push(ref(db, "minecraftChat/messages"), {
      name: username,
      text: text.slice(0, 300),
      createdAt: serverTimestamp()
    });
    input.value = "";
    status.textContent = "Connected as " + username;
  } catch (error) {
    status.textContent = "Couldn't send: " + error.message;
  } finally {
    input.disabled = false;
    input.focus();
  }
});

status.textContent = "Connected as " + (username || "choose a username");
</script>
</body>
</html>
