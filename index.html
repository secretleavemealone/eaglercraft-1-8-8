<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eaglercraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#080b13;color:#f5f7ff}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#26345a 0%,#111827 48%,#080b13 100%)}
.card{width:min(440px,calc(100vw - 36px));padding:34px;border:1px solid #ffffff24;border-radius:18px;background:#111827e8;box-shadow:0 24px 80px #0009}
h1{font-size:28px;margin:0 0 8px}.sub{color:#aab5cc;margin:0 0 26px;font-size:14px}
label{display:block;font-size:13px;color:#c8d2e8;margin:0 0 9px}
select{width:100%;padding:13px 14px;border:1px solid #ffffff30;border-radius:10px;background:#202b40;color:#fff;font-size:15px}
button{width:100%;margin-top:18px;padding:13px 16px;border:0;border-radius:10px;background:#8b5cf6;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
#game{display:none;position:fixed;inset:0;background:#000}
#game iframe{width:100%;height:100%;border:0;background:#000}
#back{position:fixed;z-index:5;top:12px;right:12px;width:auto;margin:0;padding:10px 14px;background:#202b40;border:1px solid #ffffff35}
@media(max-width:480px){.card{padding:25px}}
</style>
</head>
<body>
<main class="card" id="picker">
<h1>Eaglercraft</h1>
<p class="sub">Choose a version and jump into the game.</p>
<label for="version">Game version</label>
<select id="version">
<option value="1.8.8">Eaglercraft 1.8.8</option>
<option value="" disabled>More versions coming soon...</option>
</select>
<button id="play">Play 1.8.8</button>
</main>
<section id="game" aria-label="Game">
<button id="back" type="button">Back to versions</button>
<iframe id="client" title="Eaglercraft 1.8.8" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe>
</section>
<script>
const picker=document.getElementById('picker');
const game=document.getElementById('game');
const frame=document.getElementById('client');
const version=document.getElementById('version');
const play=document.getElementById('play');
version.addEventListener('change',()=>{play.textContent=version.value?'Play '+version.value:'Coming soon';play.disabled=!version.value;});
play.addEventListener('click',()=>{
 if(version.value!=='1.8.8')return;
 picker.style.display='none';game.style.display='block';
 frame.onload=()=>{
  try{
   const d=frame.contentDocument;
   const launch=d&&d.getElementById('launch_countdown_screen');
   const start=d&&d.getElementById('skipCountdown');
   if(launch)launch.style.display='none';
   if(start)start.click();
  }catch(e){console.warn('Could not auto-start client:',e);}
 };
 frame.src='./game.html';
});
document.getElementById('back').addEventListener('click',()=>{
 frame.src='about:blank';game.style.display='none';picker.style.display='block';
});
</script>
</body>
</html>
